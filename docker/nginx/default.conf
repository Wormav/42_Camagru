# Camagru — Nginx vhost.
server {
	listen 80 default_server;
	server_name _;

	root  /var/www/html/public;
	index index.php;

	# Static files (CSS, JS, uploads): served directly, no PHP overhead.
	# Falls back to the front controller for everything else.
	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	# Block dotfiles (e.g. .env, .git) just in case.
	location ~ /\. {
		deny all;
		return 404;
	}

	# PHP front controller via FastCGI to the `app` service on the Docker network.
	location ~ \.php$ {
		try_files $uri =404;
		fastcgi_pass app:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param DOCUMENT_ROOT   $document_root;
	}

	# Matches php.ini's post_max_size (14M) for snap uploads.
	client_max_body_size 14m;
}
