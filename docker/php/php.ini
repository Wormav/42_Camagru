; Camagru-specific PHP runtime overrides.
upload_max_filesize = 12M
post_max_size       = 14M
memory_limit        = 128M

; Send logs to stderr so docker-compose logs captures them.
log_errors          = On
error_log           = /dev/stderr

; display_errors is enforced at runtime by public/index.php based on APP_ENV.
display_errors      = Off

; Default timezone for date() calls in Mailer headers, session cookies, etc.
date.timezone       = UTC
